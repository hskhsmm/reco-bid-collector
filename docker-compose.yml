services:
  mariadb:
    image: mariadb:11.2
    container_name: reco-bidding-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: bidding_collector
      MARIADB_USER: reco
      MARIADB_PASSWORD: reco1234
    volumes:
      - mariadb_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mariadb_data:
