spring:
  application:
    name: RecoBiddingCollector

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/bidding_collector}
    username: ${SPRING_DATASOURCE_USERNAME:reco}
    password: ${SPRING_DATASOURCE_PASSWORD:reco1234}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: true

logging:
  level:
    root: INFO
    io.reco.collector: DEBUG
    org.hibernate.SQL: DEBUG

# 크롤링 설정
crawler:
  headless: true
  page-load-timeout: 30
  implicit-wait: 10
  request-delay: 1000
  max-retry: 3
  base-url: https://nuri.g2b.go.kr
