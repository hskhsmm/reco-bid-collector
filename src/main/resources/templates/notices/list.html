<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('공고 목록 - RECO Bidding Collector')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container flex-grow-1">
    <h2 class="mb-4">공고 목록</h2>

    <!-- 필터 바 -->
    <form th:action="@{/notices}" method="get" class="card mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="keyword" class="form-label">키워드 검색</label>
                    <input type="text" class="form-control" id="keyword" name="keyword"
                           th:value="${keyword}" placeholder="공고명으로 검색">
                </div>
                <div class="col-md-3">
                    <label for="businessType" class="form-label">업무분류</label>
                    <select class="form-select" id="businessType" name="businessType">
                        <option value="">전체</option>
                        <option th:each="bt : ${businessTypes}"
                                th:value="${bt.name()}"
                                th:text="${bt.koreanName}"
                                th:selected="${bt.name() == businessType}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">검색</button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/notices}" class="btn btn-outline-secondary w-100">초기화</a>
                </div>
            </div>
        </div>
    </form>

    <!-- 결과 요약 -->
    <p class="text-muted mb-3">
        총 <strong th:text="${notices.totalElements}">0</strong>건
        (<span th:text="${notices.number + 1}">1</span> / <span th:text="${notices.totalPages}">1</span> 페이지)
    </p>

    <!-- 공고 테이블 -->
    <div class="table-responsive">
        <table class="table table-hover table-striped">
            <thead class="table-dark">
                <tr>
                    <th>공고번호</th>
                    <th>공고명</th>
                    <th>업무분류</th>
                    <th>진행상태</th>
                    <th>기관명</th>
                    <th>공고일</th>
                    <th>마감일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="notice : ${notices.content}">
                    <td th:text="${notice.bidNoticeNo}">-</td>
                    <td>
                        <a th:href="@{/notices/{id}(id=${notice.id})}"
                           th:text="${notice.bidNoticeName}">공고명</a>
                    </td>
                    <td>
                        <span th:if="${notice.businessType != null}"
                              th:text="${notice.businessType.koreanName}"
                              th:classappend="${notice.businessType.name() == 'CONSTRUCTION' ? 'badge-construction' :
                                               (notice.businessType.name() == 'SERVICE' ? 'badge-service' : 'badge-goods')}"
                              class="badge">-</span>
                    </td>
                    <td>
                        <span th:if="${notice.progressStatus != null}"
                              th:text="${notice.progressStatus.koreanName}"
                              class="badge bg-info text-dark">-</span>
                    </td>
                    <td th:text="${notice.organization != null ? notice.organization.orgName : '-'}">-</td>
                    <td th:text="${notice.noticeDt != null ? #temporals.format(notice.noticeDt, 'yyyy-MM-dd') : '-'}">-</td>
                    <td th:text="${notice.bidEndDt != null ? #temporals.format(notice.bidEndDt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(notices.content)}">
                    <td colspan="7" class="text-center text-muted py-4">조회된 공고가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이징 -->
    <nav th:if="${notices.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${notices.first ? 'disabled' : ''}">
                <a class="page-link"
                   th:href="@{/notices(page=${notices.number - 1}, keyword=${keyword}, businessType=${businessType})}">이전</a>
            </li>
            <th:block th:with="start=${T(Math).max(0, notices.number - 4)}, end=${T(Math).min(notices.totalPages - 1, notices.number + 4)}">
                <li class="page-item" th:each="i : ${#numbers.sequence(start, end)}"
                    th:classappend="${i == notices.number ? 'active' : ''}">
                    <a class="page-link"
                       th:href="@{/notices(page=${i}, keyword=${keyword}, businessType=${businessType})}"
                       th:text="${i + 1}">1</a>
                </li>
            </th:block>
            <li class="page-item" th:classappend="${notices.last ? 'disabled' : ''}">
                <a class="page-link"
                   th:href="@{/notices(page=${notices.number + 1}, keyword=${keyword}, businessType=${businessType})}">다음</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
