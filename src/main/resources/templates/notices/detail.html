<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('공고 상세 - RECO Bidding Collector')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${notice.bidNoticeName}">공고명</h2>
        <a th:href="@{/notices}" class="btn btn-outline-secondary">목록으로</a>
    </div>

    <!-- 기본 정보 카드 -->
    <div class="card mb-4">
        <div class="card-header">기본 정보</div>
        <div class="card-body">
            <table class="table table-bordered mb-0">
                <tbody>
                    <tr>
                        <th class="table-light" style="width:180px">공고번호</th>
                        <td th:text="${notice.bidNoticeNo}">-</td>
                        <th class="table-light" style="width:180px">업무분류</th>
                        <td>
                            <span th:if="${notice.businessType != null}" th:text="${notice.businessType.koreanName}">-</span>
                            <span th:if="${notice.businessType == null}">-</span>
                        </td>
                    </tr>
                    <tr>
                        <th class="table-light">진행상태</th>
                        <td>
                            <span th:if="${notice.progressStatus != null}" th:text="${notice.progressStatus.koreanName}">-</span>
                            <span th:if="${notice.progressStatus == null}">-</span>
                        </td>
                        <th class="table-light">계약방법</th>
                        <td>
                            <span th:if="${notice.contractMethod != null}" th:text="${notice.contractMethod.koreanName}">-</span>
                            <span th:if="${notice.contractMethod == null}">-</span>
                        </td>
                    </tr>
                    <tr>
                        <th class="table-light">공고일시</th>
                        <td th:text="${notice.noticeDt != null ? #temporals.format(notice.noticeDt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                        <th class="table-light">입찰마감</th>
                        <td th:text="${notice.bidEndDt != null ? #temporals.format(notice.bidEndDt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    </tr>
                    <tr>
                        <th class="table-light">기관명</th>
                        <td th:text="${notice.organization != null ? notice.organization.orgName : '-'}">-</td>
                        <th class="table-light">수집일시</th>
                        <td th:text="${notice.collectedAt != null ? #temporals.format(notice.collectedAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                    </tr>
                    <tr>
                        <th class="table-light">파싱상태</th>
                        <td>
                            <span th:if="${notice.parseStatus != null}"
                                  th:text="${notice.parseStatus.name()}"
                                  th:classappend="${notice.parseStatus.name() == 'SUCCESS' ? 'bg-success' :
                                                   (notice.parseStatus.name() == 'FAILED' ? 'bg-danger' : 'bg-warning text-dark')}"
                                  class="badge">-</span>
                        </td>
                        <td colspan="2"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- JSON 섹션: 공고 정보 -->
    <div th:if="${notice.noticeInfo != null and !notice.noticeInfo.isBlank()}" class="card mb-4">
        <div class="card-header">공고 정보</div>
        <div class="card-body p-0">
            <div class="json-section" th:attr="data-json=${notice.noticeInfo}"></div>
        </div>
    </div>

    <!-- JSON 섹션: 일정 정보 -->
    <div th:if="${notice.scheduleInfo != null and !notice.scheduleInfo.isBlank()}" class="card mb-4">
        <div class="card-header">일정 정보</div>
        <div class="card-body p-0">
            <div class="json-section" th:attr="data-json=${notice.scheduleInfo}"></div>
        </div>
    </div>

    <!-- JSON 섹션: 금액 정보 -->
    <div th:if="${notice.amountInfo != null and !notice.amountInfo.isBlank()}" class="card mb-4">
        <div class="card-header">금액 정보</div>
        <div class="card-body p-0">
            <div class="json-section" th:attr="data-json=${notice.amountInfo}"></div>
        </div>
    </div>

    <!-- JSON 섹션: 상세 정보 -->
    <div th:if="${notice.detailInfo != null and !notice.detailInfo.isBlank()}" class="card mb-4">
        <div class="card-header">상세 정보</div>
        <div class="card-body p-0">
            <div class="json-section" th:attr="data-json=${notice.detailInfo}"></div>
        </div>
    </div>

    <!-- 첨부파일 -->
    <div th:if="${notice.attachments != null and !notice.attachments.isEmpty()}" class="card mb-4">
        <div class="card-header">첨부파일 (<span th:text="${#lists.size(notice.attachments)}">0</span>건)</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>파일명</th>
                        <th>문서유형</th>
                        <th>파일크기</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="att, stat : ${notice.attachments}">
                        <td th:text="${stat.count}">1</td>
                        <td>
                            <a th:if="${att.fileUrl != null}" th:href="${att.fileUrl}" th:text="${att.fileName}" target="_blank">파일명</a>
                            <span th:if="${att.fileUrl == null}" th:text="${att.fileName}">파일명</span>
                        </td>
                        <td th:text="${att.docType != null ? att.docType : '-'}">-</td>
                        <td th:text="${att.fileSize != null ? att.fileSize + ' bytes' : '-'}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mb-4">
        <a th:href="@{/notices}" class="btn btn-outline-secondary">목록으로 돌아가기</a>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // JSON 섹션 렌더링: data-json 속성의 JSON을 테이블로 변환
    document.querySelectorAll('.json-section').forEach(function(el) {
        try {
            var data = JSON.parse(el.getAttribute('data-json'));
            var table = '<table class="table table-bordered mb-0"><tbody>';
            if (typeof data === 'object' && data !== null) {
                Object.keys(data).forEach(function(key) {
                    var val = data[key];
                    if (val === null || val === undefined) val = '-';
                    else if (typeof val === 'object') val = JSON.stringify(val, null, 2);
                    table += '<tr><th class="table-light" style="width:200px">' +
                             escapeHtml(key) + '</th><td>' + escapeHtml(String(val)) + '</td></tr>';
                });
            }
            table += '</tbody></table>';
            el.innerHTML = table;
        } catch (e) {
            el.innerHTML = '<pre class="p-3 mb-0">' + escapeHtml(el.getAttribute('data-json')) + '</pre>';
        }
    });

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }
</script>
</body>
</html>
