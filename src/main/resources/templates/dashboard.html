<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('대시보드 - 나라장터 입찰공고 수집기')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container flex-grow-1">
    <h2 class="mb-2">나라장터 입찰공고 수집</h2>
    <p class="text-muted mb-4">나라장터(G2B)에 등록된 입찰공고를 자동으로 수집합니다. 조건을 설정하고 수집을 시작하세요.</p>

    <!-- 크롤링 상태 카드 -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">상태</h6>
                    <span id="statusBadge" class="badge bg-secondary">대기</span>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">수집 건수</h6>
                    <h3 id="totalCollected" class="card-title">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">실패 건수</h6>
                    <h3 id="totalFailed" class="card-title">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">소요 시간</h6>
                    <h5 id="elapsed" class="card-title">-</h5>
                </div>
            </div>
        </div>
    </div>

    <!-- 수집 설정 폼 -->
    <div class="card mb-4">
        <div class="card-header">수집 조건 설정</div>
        <div class="card-body">
            <form id="startForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="keyword" class="form-label">공고명 키워드</label>
                        <input type="text" class="form-control" id="keyword" name="keyword" placeholder="미입력 시 전체 수집">
                    </div>
                    <div class="col-md-4">
                        <label for="businessType" class="form-label">업무분류</label>
                        <select class="form-select" id="businessType" name="businessType">
                            <option value="전체" selected>전체</option>
                            <option value="물품">물품</option>
                            <option value="용역">용역</option>
                            <option value="공사">공사</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="crawlType" class="form-label">수집 방식</label>
                        <select class="form-select" id="crawlType" name="type">
                            <option value="INCREMENTAL" selected>새 공고만 수집</option>
                            <option value="FULL">처음부터 전체 수집</option>
                        </select>
                        <div class="form-text">이미 수집한 공고는 자동으로 건너뜁니다.</div>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" id="btnStart" class="btn btn-primary">수집 시작</button>
                    <button type="button" id="btnStop" class="btn btn-danger ms-2" disabled>수집 중지</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 실행 정보 -->
    <div class="card mb-4">
        <div class="card-header">수집 현황</div>
        <div class="card-body">
            <table class="table table-sm mb-0">
                <tbody>
                    <tr><th style="width:150px">수집 방식</th><td id="crawlTypeInfo">-</td></tr>
                    <tr><th>진행 페이지</th><td id="lastPage">-</td></tr>
                    <tr><th>시작 시각</th><td id="startedAt">-</td></tr>
                    <tr><th>완료 시각</th><td id="completedAt">-</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 최근 수집 공고 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>최근 수집된 공고 (전체 <strong id="totalNoticeCount" th:text="${totalCount}">0</strong>건)</span>
            <a th:href="@{/notices}" class="btn btn-sm btn-outline-primary">전체 목록 보기</a>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>공고명</th>
                            <th style="width:80px">업무분류</th>
                            <th style="width:80px">진행상태</th>
                            <th>기관명</th>
                            <th style="width:110px">공고일</th>
                            <th style="width:140px">마감일</th>
                        </tr>
                    </thead>
                    <tbody id="recentNoticesBody">
                        <tr th:each="notice : ${recentNotices}">
                            <td>
                                <a th:href="@{/notices/{id}(id=${notice.id})}"
                                   th:text="${notice.bidNoticeName}" class="text-decoration-none">공고명</a>
                            </td>
                            <td>
                                <span th:if="${notice.businessType != null}"
                                      th:text="${notice.businessType.koreanName}"
                                      th:classappend="${notice.businessType.name() == 'CONSTRUCTION' ? 'badge-construction' :
                                                       (notice.businessType.name() == 'SERVICE' ? 'badge-service' : 'badge-goods')}"
                                      class="badge">-</span>
                            </td>
                            <td>
                                <span th:if="${notice.progressStatus != null}"
                                      th:text="${notice.progressStatus.koreanName}"
                                      class="badge bg-info text-dark">-</span>
                            </td>
                            <td th:text="${notice.organization != null ? notice.organization.orgName : '-'}">-</td>
                            <td th:text="${notice.noticeDt != null ? #temporals.format(notice.noticeDt, 'yyyy-MM-dd') : '-'}">-</td>
                            <td th:text="${notice.bidEndDt != null ? #temporals.format(notice.bidEndDt, 'MM-dd HH:mm') : '-'}">-</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(recentNotices)}">
                            <td colspan="6" class="text-center text-muted py-4">수집된 공고가 없습니다. 위에서 수집을 시작하세요.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
